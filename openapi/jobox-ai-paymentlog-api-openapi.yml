components:
  schemas:
    PaymentLogDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        paymentId:
          type: integer
          format: int64
        jobId:
          type: integer
          format: int64
        amount:
          type: number
        tip:
          type: number
        notes:
          type: string
        paymentType:
          type: string
          enum:
          - CARD
          - CASH
          - EXTERNAL
          - CHECK
        transactionType:
          type: string
          enum:
          - PAYMENT
          - REFUND
          - DISPUTE
        userId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
        cardPaymentDetails:
          $ref: '#/components/schemas/CardPaymentDetails'
    PaymentLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        paymentId:
          type: integer
          format: int64
        jobId:
          type: integer
          format: int64
        amount:
          type: number
        tip:
          type: number
        notes:
          type: string
        paymentType:
          type: string
          enum:
          - CARD
          - CASH
          - EXTERNAL
          - CHECK
        transactionType:
          type: string
          enum:
          - PAYMENT
          - REFUND
          - DISPUTE
        userId:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    CardPaymentDetails:
      type: object
      properties:
        id:
          type: integer
          format: int64
        paymentLogId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        transactionPercent:
          type: number
        interchangeFee:
          type: number
        ccTotalFee:
          type: number
        paymentSource:
          type: string
          enum:
          - STRIPE
        paymentSourceId:
          type: string
        brand:
          type: string
        customer:
          type: string
        funding:
          type: string
        cardEntryMethod:
          type: string
          enum:
          - SWIPE
          - CHIP
          - MANUAL
        fingerprint:
          type: string
        last4:
          type: string
        zip:
          type: string
        createdAt:
          type: string
          format: date-time
        active:
          type: boolean
