    get:
      tags:
      - paymentlog
      operationId: read_11
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        default:
          description: successful operation
      summary: Read 11
      x-summary-source: derived
  /paymentlog:
    post:
      tags:
      - paymentlog
      operationId: create_11
      parameters:
      - name: User-Id
        in: header
        required: false
        schema:
          type: integer
          format: int64
      - name: for_tech
        in: query
        required: false
        schema:
          type: boolean
      responses:
        default:
          description: successful operation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentLogDTO'
