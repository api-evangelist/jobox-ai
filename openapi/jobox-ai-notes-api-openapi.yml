openapi: 3.2.0
info:
  version: 1.2.3(1S)
  title: Jobox Ai Notes API
servers:
- url: https://https://staging.jobox.ai/Kili
tags:
- name: Notes
paths:
  /notes/{entity_type}/{entity_id}:
    get:
      tags:
      - Notes
      operationId: read_10
      parameters:
      - name: User-Id
        in: header
        required: false
        schema:
          type: integer
          format: int64
      - name: entity_type
        in: path
        required: true
        schema:
          type: string
          enum:
          - JOB
          - JOB_LOG
          - PAYMENT
          - PAYMENT_LOG
          - WALLET_LOG
          - RECEIPT
          - COMMODITY
      - name: entity_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        default:
          description: successful operation
      summary: Read 10
      x-summary-source: derived
  /notes:
    post:
      tags:
      - Notes
      operationId: create_10
      parameters:
      - name: User-Id
        in: header
        required: false
        schema:
          type: integer
          format: int64
      responses:
        default:
          description: successful operation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Note'
      summary: Create 10
      x-summary-source: derived
components:
  schemas:
    Note:
      type: object
      properties:
        id:
          type: integer
          format: int64
        byUserId:
          type: integer
          format: int64
        entityId:
          type: integer
          format: int64
        entityType:
          type: string
          enum:
          - JOB
          - JOB_LOG
          - PAYMENT
          - PAYMENT_LOG
          - WALLET_LOG
          - RECEIPT
          - COMMODITY
        content:
          type: string
        attachmentType:
          type: string
          enum:
          - TEXT
          - IMAGE
          - AUDIO
          - VIDEO
        attachment:
          type: string
        shared:
          type: boolean
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
