openapi: 3.2.0
info:
  version: 1.2.3(1S)
  title: Jobox Ai Wallet Alias API
servers:
- url: https://https://staging.jobox.ai/Kili
tags:
- name: wallet_alias
paths:
  /wallet/alias/{user_id}:
    get:
      tags:
      - wallet_alias
      operationId: readForUserId
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: User-Id
        in: header
        required: false
        schema:
          type: integer
          format: int64
      responses:
        default:
          description: successful operation
      summary: Read for user id
      x-summary-source: derived
  /wallet/alias:
    post:
      tags:
      - wallet_alias
      operationId: create_19
      parameters:
      - name: user-id
        in: header
        required: false
        schema:
          type: integer
          format: int64
      - name: password
        in: header
        required: false
        schema:
          type: string
      responses:
        default:
          description: successful operation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletLogAlias'
      summary: Create 19
      x-summary-source: derived
    delete:
      tags:
      - wallet_alias
      operationId: archive_4
      parameters:
      - name: user-id
        in: header
        required: false
        schema:
          type: integer
          format: int64
      responses:
        default:
          description: successful operation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletLogAlias'
      summary: Archive 4
      x-summary-source: derived
components:
  schemas:
    WalletLogAlias:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fromUserId:
          type: integer
          format: int64
        toUserId:
          type: integer
          format: int64
        byUserId:
          type: integer
          format: int64
        active:
          type: boolean
        regardlessOfOwner:
          type: boolean
        toUserIdGetsTips:
          type: boolean
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        joinId:
          type: integer
          format: int64
