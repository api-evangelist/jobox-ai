openapi: 3.2.0
info:
  version: 1.2.3(1S)
  title: Jobox Ai Receipts API
servers:
- url: https://https://staging.jobox.ai/Kili
tags:
- name: Receipts
paths:
  /receipts/{receipt_key}/feedback:
    post:
      tags:
      - Receipts
      operationId: getFeedback
      parameters:
      - name: receipt_key
        in: path
        required: true
        schema:
          type: string
      responses:
        default:
          description: successful operation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobFeedback'
      summary: Get feedback
      x-summary-source: derived
  /receipts/v2/{receipt_key}:
    get:
      tags:
      - Receipts
      operationId: read_13
      parameters:
      - name: receipt_key
        in: path
        required: true
        schema:
          type: string
      - name: Timezone
        in: header
        required: false
        schema:
          type: string
      - name: preview
        in: query
        required: false
        schema:
          type: boolean
      responses:
        default:
          description: successful operation
      summary: Read 13
      x-summary-source: derived
  /receipts/new:
    post:
      tags:
      - Receipts
      operationId: create_14
      parameters:
      - name: Timezone
        in: header
        required: false
        schema:
          type: string
      responses:
        default:
          description: successful operation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReceiptWithNotesDTO'
      summary: Create 14
      x-summary-source: derived
components:
  schemas:
    JobFeedback:
      type: object
      properties:
        id:
          type: integer
          format: int64
        receiptLogId:
          type: integer
          format: int64
        feedback:
          type: string
          enum:
          - HAPPY
          - SAD
        feedbackTs:
          type: string
          format: date-time
    ReceiptRequestDTO:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        companyName:
          type: string
        email:
          type: string
        phoneNumber:
          type: string
        notes:
          type: string
        jobId:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        timezone:
          type: string
    Note:
      type: object
      properties:
        id:
          type: integer
          format: int64
        byUserId:
          type: integer
          format: int64
        entityId:
          type: integer
          format: int64
        entityType:
          type: string
          enum:
          - JOB
          - JOB_LOG
          - PAYMENT
          - PAYMENT_LOG
          - WALLET_LOG
          - RECEIPT
          - COMMODITY
        content:
          type: string
        attachmentType:
          type: string
          enum:
          - TEXT
          - IMAGE
          - AUDIO
          - VIDEO
        attachment:
          type: string
        shared:
          type: boolean
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
    ReceiptWithNotesDTO:
      type: object
      properties:
        receiptRequestDTO:
          $ref: '#/components/schemas/ReceiptRequestDTO'
        note:
          $ref: '#/components/schemas/Note'
