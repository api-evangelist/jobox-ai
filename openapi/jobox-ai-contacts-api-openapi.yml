openapi: 3.2.0
info:
  version: 1.2.3(1S)
  title: Jobox Ai Contacts API
servers:
- url: https://https://staging.jobox.ai/Kili
tags:
- name: contacts
paths:
  /contacts/{id}/aliases/{entity_type}:
    get:
      tags:
      - contacts
      operationId: readAliases
      parameters:
      - name: User-Id
        in: header
        required: false
        schema:
          type: integer
          format: int64
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: entity_type
        in: path
        required: true
        schema:
          type: string
          enum:
          - JOB
          - JOB_LOG
          - PAYMENT
          - PAYMENT_LOG
          - WALLET_LOG
          - RECEIPT
          - COMMODITY
      responses:
        default:
          description: successful operation
  /contacts/delete:
    put:
      tags:
      - contacts
      operationId: archiveForRetrofit
      parameters:
      - name: User-Id
        in: header
        required: false
        schema:
          type: integer
          format: int64
      responses:
        default:
          description: successful operation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactDTO'
  /contacts/{contact_id}:
    put:
      tags:
      - contacts
      operationId: update_1
      parameters:
      - name: Version
        in: header
        required: false
        schema:
          type: string
      - name: platform
        in: header
        required: false
        schema:
          type: string
      - name: User-id
        in: header
        required: false
        schema:
          type: integer
          format: int64
      - name: contact_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        default:
          description: successful operation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactDTO'
    delete:
      tags:
      - contacts
      operationId: archive_1
      parameters:
      - name: User-Id
        in: header
        required: false
        schema:
          type: integer
          format: int64
      - name: contact_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        default:
          description: successful operation
  /contacts:
    post:
      tags:
      - contacts
      operationId: create_3
      parameters:
      - name: User-Id
        in: header
        required: false
        schema:
          type: integer
          format: int64
      responses:
        default:
          description: successful operation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactDTO'
    delete:
      tags:
      - contacts
      operationId: archive_2
      parameters:
      - name: User-Id
        in: header
        required: false
        schema:
          type: integer
          format: int64
      responses:
        default:
          description: successful operation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactDTO'
  /contacts/{id}:
    get:
      tags:
      - contacts
      operationId: read_1
      parameters:
      - name: User-Id
        in: header
        required: false
        schema:
          type: integer
          format: int64
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int64
      responses:
        default:
          description: successful operation
components:
  schemas:
    Fraction:
      type: object
      properties:
        id:
          type: integer
          format: int64
        contactId:
          type: integer
          format: int64
        fraction:
          type: number
        fee:
          type: number
        startHour:
          type: integer
          format: int32
        startMin:
          type: integer
          format: int32
        endHour:
          type: integer
          format: int32
        endMin:
          type: integer
          format: int32
        weekday:
          type: string
          enum:
          - MONDAY
          - TUESDAY
          - WEDNESDAY
          - THURSDAY
          - FRIDAY
          - SATURDAY
          - SUNDAY
          - ALL
        type:
          type: string
          enum:
          - TRANSFER
          - RECEIVE
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        joinId:
          type: integer
          format: int64
    WalletLogAlias:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fromUserId:
          type: integer
          format: int64
        toUserId:
          type: integer
          format: int64
        byUserId:
          type: integer
          format: int64
        active:
          type: boolean
        regardlessOfOwner:
          type: boolean
        toUserIdGetsTips:
          type: boolean
        createdAt:
          type: string
          format: date-time
        modifiedAt:
          type: string
          format: date-time
        joinId:
          type: integer
          format: int64
    JobStatusAlias:
      type: object
      properties:
        id:
          type: integer
          format: int64
        contactId:
          type: integer
          format: int64
        aliasContactId:
          type: integer
          format: int64
        justAlias:
          type: boolean
        status:
          type: string
          enum:
          - PENDING
          - ACCEPT
          - REJECT
          - COMPLETE
          - CANCEL
          - REVOKE
          - UPDATE
          - CLOSING
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        joinId:
          type: integer
          format: int64
    ContactDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        associatedUserId:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
        joboxUser:
          type: boolean
        phoneNumber:
          type: string
        companyName:
          type: string
        paymentDetails:
          type: string
        transferFractionFeeSummary:
          type: string
        receiveFractionFeeSummary:
          type: string
        profileUrl:
          type: string
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        transferFractions:
          type: array
          items:
            $ref: '#/components/schemas/Fraction'
        receiveFractions:
          type: array
          items:
            $ref: '#/components/schemas/Fraction'
        fractionList:
          type: array
          items:
            $ref: '#/components/schemas/Fraction'
        statusAliasList:
          type: array
          items:
            $ref: '#/components/schemas/JobStatusAlias'
        walletAliasList:
          type: array
          items:
            $ref: '#/components/schemas/WalletLogAlias'
        joinId:
          type: integer
          format: int64
