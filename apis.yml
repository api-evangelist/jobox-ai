apis:
- aid: jobox-ai:kili
  name: Jobox Kili API
  description: The Jobox "Kili" platform API — the production HTTP API behind the Jobox pro app and the
    Jobox managed-marketplace product. Covers jobs (create, dispatch, status, logs, notes, descriptions
    and description parsing), users and contacts, occupations and commodities, payments and payment logs,
    receipts, disputes, bank info, KYC identification upload, wallet (v2/v3), Stripe linkage, referrals,
    reporting and Jobox virtual phone numbers. 91 paths / 110 operations.
  humanURL: https://www.jobox.ai/marketplace
