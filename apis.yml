x-pointers-deliberately-absent:
- type: DeveloperPortal
  reason: Jobox operates no developer portal. developer/developers/docs/dev/api-docs .jobox.ai all fail
    to resolve.
- type: APIReference
  reason: No API reference is published. The footer of jobox.ai/marketplace lists "API Documentation"
    as a product but it is not a link and no such page exists.
- type: SignUp
  reason: No web signup or login. Pros onboard by downloading the mobile app; the marketplace/API product
    is gated behind "Request a demo" / "Contact Sales".
- type: Pricing
  reason: https://www.jobox.ai/pricing returns 404. See plans/jobox-ai-plans-pricing.yml (plan_count 0).
- type: StatusPage
  reason: status.jobox.ai does not resolve; no status page linked anywhere.
- type: Deprecation
  reason: No deprecation or sunset policy published. See lifecycle/jobox-ai-lifecycle.yml.
- type: ChangeLog
  reason: No changelog published.
- type: Roadmap
  reason: No public roadmap.
- type: GitHubOrganization
  reason: No GitHub organization is linked from anything Jobox publishes. github.com/joboxapp is a 2016
    empty Rails scaffold with unproven ownership — see packages/jobox-ai-packages.yml.
- type: Postman
  reason: No public Postman workspace or collection found.
- type: WellKnown
  reason: Every /.well-known/* path 404s on www.jobox.ai and api.jobox.ai. The probe is recorded at well-known/jobox-ai-well-known.yml
    with no pointer, per the rule that a pointer asserts the provider serves the surface.
- type: SecurityTxt
  reason: The only served security.txt on a jobox.ai host (help.jobox.ai) is Intercom's vendor document,
    not Jobox's.
- type: Security
  reason: probe-security-programs.py found no vulnerability disclosure policy, no bug bounty and no disclosure
    page for Jobox.
- type: Compliance
  reason: Jobox publishes no compliance program, certification list or trust center of its own.
- type: TrustCenter
  reason: No trust center. trust.jobox.ai does not resolve.
- type: SDKs
  reason: Zero first-party client libraries in any public registry. See packages/jobox-ai-packages.yml.
- type: Idempotency
  reason: No Idempotency-Key or equivalent header on any of the 110 contract operations and no idempotency
    documentation. The Conventions artifact records the absence.
- type: AgentCard
  reason: '/.well-known/agent-card.json and /.well-known/agent.json return 404 on every jobox.ai host.
    Search-only artifact: nothing written.'
- type: AsyncAPI
  reason: No event, streaming or webhook surface is published or present in the contract.
- type: Sandbox
