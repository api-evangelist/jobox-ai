aid: jobox-ai
name: JOBOX.ai
description: JOBOX.ai (Jobox) is a home-services fintech and marketplace-infrastructure platform for skilled
  trades professionals — locksmiths, plumbers, HVAC and appliance technicians. Founded in California in
  2016 and operating since 2018, Jobox runs a mobile business app for independent pros (job intake from
  SMS/WhatsApp, dispatching, invoicing, tap-to-pay card acceptance, receipts, settlement reports, the
  Jobox Wallet and a Jobox credit card) plus a B2B "managed marketplace" product that lets retailers,
  distributors, discovery platforms and franchises embed home services into their own customer journeys
  through programmable APIs, an automated dispatch algorithm, a demand-partner dashboard, Jobox-handled
  KYC and weekly settlement reconciliation. Jobox.ai was acquired by Talus Pay in January 2024; the pro-facing
  mobile app and help center have since been rebranded to Talus Pay while the jobox.ai marketing site
  and the api.jobox.ai "Kili" production API remain live.
